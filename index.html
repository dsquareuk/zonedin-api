const DaysWonGrid = ({ rowsByDate, today }) => {

  const col = (d) => {
    if (d > today) return { bg: "transparent", b: "rgba(255,255,255,0.03)", label: "" };
    const r = rowsByDate[d];
    if (!r || !r.committed_at) return { bg: "rgba(255,255,255,0.025)", b: T.border, label: "Not committed" };
    const c = dayCounts(r, d < today);
    if (d === today && !r.closed_at && c.pending) return { bg: "rgba(0,194,178,0.05)", b: "rgba(0,194,178,0.45)", label: "In progress" };
    if (c.kept === c.committed) return { bg: "rgba(0,194,178,0.55)", b: "rgba(0,194,178,0.8)", label: "All kept" };
    if (c.kept > 0) return { bg: "rgba(245,158,11,0.35)", b: "rgba(245,158,11,0.55)", label: "Some kept" };
    return { bg: "rgba(226,114,111,0.18)", b: "rgba(226,114,111,0.35)", label: "None kept" };
  };
  const legend = [["rgba(0,194,178,0.55)", "All kept"], ["rgba(245,158,11,0.35)", "Some"], ["rgba(226,114,111,0.18)", "None"], ["rgba(255,255,255,0.025)", "Not committed"]];
  return RC("div", { style: __spreadProps(__spreadValues({}, card()), { margin: "0 16px 12px" }) },
